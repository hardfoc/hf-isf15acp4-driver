<text x="48" y="307.4" font-size="17" font-weight="700" fill="#C7CBFF">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#C7CBFF">SmartDisplay&lt;SpiType&gt;, inc/isf15acp4.hpp</text>
<text x="56" y="510.4" font-size="20" font-weight="700" fill="#C7CBFF">Communication interface</text>
<text x="56" y="541" font-size="17" fill="#D2DAE4">SpiInterface&lt;Derived&gt;: CRTP base, command and data transactions resolved at compile time,</text>
<text x="56" y="565.7" font-size="17" fill="#D2DAE4">control pins by name (SS, D/C, RES, VCC enable, switch) as ACTIVE / INACTIVE</text>
<text x="56" y="664.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform port (your class)</text>
<text x="56" y="693.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">EnsureInitialized()  BeginCommand()  BeginData()  EndTransaction()</text>
<text x="56" y="716.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">WriteBytes()  GpioSet()  GpioRead()  DelayUs()</text>
<text x="56" y="815.4" font-size="20" font-weight="700" fill="#E8EDF3">ISF15ACP4</text>
<text x="56" y="846" font-size="17" fill="#D2DAE4">SPI write-only up to 6.6 MHz (150 ns cycle)  /  SS, D/C, RES, VCC 15 V, switch pins 1-2</text>
