---
name: 🔍 C++ Analysis CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  cppcheck:
    uses: hardfoc/hf-general-ci-tools/.github/workflows/ru-cpp-analysis.yml@main
    with:
      source_dirs: "inc,src,examples/esp32/main"
      suppressions: "_config/cppcheck-suppressions.txt"
      std: "c++20"
